name: Deploy to Render

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: render-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Trigger Render deployment
    runs-on: ubuntu-latest
    steps:
      - name: Deploy latest commit to Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              echo "::error::Add the RENDER_DEPLOY_HOOK_URL secret in GitHub repository Settings > Secrets and variables > Actions before starting a manual deployment."
              exit 1
            fi
            echo "::warning::RENDER_DEPLOY_HOOK_URL is not set; GitHub skipped this deploy. Enable automatic deploys for this branch in Render, or add the secret to let GitHub trigger Render."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"
